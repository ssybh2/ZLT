name: Build HIPNUC IMU CAN 0x11-0x13 firmware

on:
  push:
    branches:
      - build-hipnucimu-can-11-13
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ZLT branch
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi git

      - name: Fetch upstream firmware source
        run: |
          git clone --depth 1 https://github.com/AIMEtherCAT/hipnucimu.git hipnucimu

      - name: Set CAN IDs for second IMU
        run: |
          sed -i 's/#define PACKET1_CAN_ID 0x01/#define PACKET1_CAN_ID 0x11/' hipnucimu/Core/Src/main.c
          sed -i 's/#define PACKET2_CAN_ID 0x02/#define PACKET2_CAN_ID 0x12/' hipnucimu/Core/Src/main.c
          sed -i 's/#define PACKET3_CAN_ID 0x03/#define PACKET3_CAN_ID 0x13/' hipnucimu/Core/Src/main.c
          grep -n 'PACKET[123]_CAN_ID' hipnucimu/Core/Src/main.c

      - name: Configure
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
            -S hipnucimu \
            -B hipnucimu/build/Release

      - name: Build ELF
        run: |
          cmake --build hipnucimu/build/Release --target hipnucimu.elf

      - name: Create BIN and manifest
        run: |
          mkdir -p firmware
          cp hipnucimu/build/Release/hipnucimu.elf firmware/hipnucimu_can_0x11_0x12_0x13.elf
          arm-none-eabi-objcopy -O binary \
            firmware/hipnucimu_can_0x11_0x12_0x13.elf \
            firmware/hipnucimu_can_0x11_0x12_0x13.bin
          cat > firmware/README.txt <<'EOF'
HIPNUC CAN IMU firmware for the SECOND module
Target source: AIMEtherCAT/hipnucimu main branch
Target MCU from upstream project: STM32G431CBTx
CAN standard IDs:
  Packet 1: 0x11
  Packet 2: 0x12
  Packet 3: 0x13
CAN bitrate: 1 Mbit/s

Use with H750 task configuration packet IDs 0x11, 0x12, 0x13.
Do not flash this into the H750 EtherCAT slave or the first IMU module.
Confirm the programming MCU is STM32G431CBTx before flashing.
EOF
          sha256sum firmware/* > firmware/SHA256SUMS.txt
          arm-none-eabi-size firmware/hipnucimu_can_0x11_0x12_0x13.elf

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: hipnucimu-can-0x11-0x13-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 30
