name: Build README demo GIF

on:
  push:
    paths:
      - '.github/workflows/build-readme-demo.yml'
      - 'docs/assets/*.mov'
      - 'docs/assets/*.mp4'
      - 'docs/assets/*.m4v'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Convert latest video to README-friendly GIF
        shell: bash
        run: |
          set -euo pipefail

          VIDEO="$(find docs/assets -maxdepth 1 -type f \( -iname '*.mov' -o -iname '*.mp4' -o -iname '*.m4v' \) -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$VIDEO" ]; then
            echo "No MOV/MP4/M4V file found in docs/assets"
            exit 1
          fi

          echo "Using source video: $VIDEO"

          make_gif() {
            local fps="$1"
            local width="$2"
            local colors="$3"
            local bayer="$4"

            ffmpeg -y -i "$VIDEO" \
              -vf "fps=${fps},scale='min(${width},iw)':-2:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=${colors}:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=${bayer}:diff_mode=rectangle" \
              docs/assets/demo.gif
          }

          # Keep README media comfortably below GitHub/Camo rendering limits.
          make_gif 7 520 80 5
          GIF_SIZE="$(stat -c%s docs/assets/demo.gif)"
          echo "Pass 1: $GIF_SIZE bytes"

          if [ "$GIF_SIZE" -gt 5242880 ]; then
            make_gif 6 440 64 6
            GIF_SIZE="$(stat -c%s docs/assets/demo.gif)"
            echo "Pass 2: $GIF_SIZE bytes"
          fi

          if [ "$GIF_SIZE" -gt 4194304 ]; then
            make_gif 5 360 48 6
            GIF_SIZE="$(stat -c%s docs/assets/demo.gif)"
            echo "Pass 3: $GIF_SIZE bytes"
          fi

          if [ "$GIF_SIZE" -gt 5242880 ]; then
            echo "Generated GIF is still too large for reliable README rendering: $GIF_SIZE bytes"
            exit 1
          fi

          file docs/assets/demo.gif
          ls -lh docs/assets/demo.gif

      - name: Commit generated demo GIF
        run: |
          if git diff --quiet -- docs/assets/demo.gif; then
            echo "demo.gif is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/demo.gif
          git commit -m "docs: regenerate compact README demo GIF"
          git push
