# STM32H750 / AX58100 four-task mapping for EtherCAT slave sn2883650.
# App1: DJI RC read; App2: CAN1 HIPNUC IMU; App3: CAN2 HIPNUC IMU;
# App4: DShot write. Match these values to the firmware actually on the slave.
# Read PDO offsets (bytes): RC=0, IMU1=19, IMU2=40. Write PDO: DShot=0.
# Do not reuse the former sn2883658 / ProductCode 0x06 / six-IMU task
# configuration with this four-task firmware.
#define UNKNOWN_APP_ID 999
#define DJIRC_APP_ID 1
#define LK_APP_ID 2
#define HIPNUC_IMU_CAN_APP_ID 3
#define DSHOT_APP_ID 4
#define DJICAN_APP_ID 5
#define VANILLA_PWM_APP_ID 6
#define EXTERNAL_PWM_APP_ID 7
#define MS5837_30BA_APP_ID 8
#define ADC_APP_ID 9
#define CAN_PMU_APP_ID 10
#define CAN_PORT_1 1
#define CAN_PORT_2 2

slaves:
  - sn2883650:
      sdo_len: !uint16_t 35
      task_count: !uint8_t 4
      latency_pub_topic: !std::string '/ecat/sn2883650/latency'

      tasks:
        - app_1:
            sdowrite_task_type: !uint8_t 1
            conf_connection_lost_read_action: !uint8_t 0x01
            pub_topic: !std::string '/ecat/sn2883650/app1/read'
            pdoread_offset: !uint16_t 0

        - app_2:
            sdowrite_task_type: !uint8_t 3
            conf_connection_lost_read_action: !uint8_t 0x01
            pub_topic: !std::string '/ecat/sn2883650/app2/read'
            pdoread_offset: !uint16_t 19
            sdowrite_can_inst: !uint8_t 1
            sdowrite_packet1_id: !uint32_t 0x01
            sdowrite_packet2_id: !uint32_t 0x02
            sdowrite_packet3_id: !uint32_t 0x03
            conf_frame_name: !std::string 'imu_link'

        - app_3:
            sdowrite_task_type: !uint8_t 3
            conf_connection_lost_read_action: !uint8_t 0x01
            pub_topic: !std::string '/ecat/sn2883650/app3/read'
            pdoread_offset: !uint16_t 40
            sdowrite_can_inst: !uint8_t 2
            sdowrite_packet1_id: !uint32_t 0x01
            sdowrite_packet2_id: !uint32_t 0x02
            sdowrite_packet3_id: !uint32_t 0x03
            conf_frame_name: !std::string 'imu_link'

        - app_4:
            sdowrite_task_type: !uint8_t 4
            sdowrite_connection_lost_write_action: !uint8_t 0x01
            sub_topic: !std::string '/ecat/sn2883650/app4/write'
            pdowrite_offset: !uint16_t 0
            sdowrite_dshot_id: !uint8_t 1
            sdowrite_init_value: !uint16_t 0
